name: Web tests

on:
  push:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-tests.yml"
  pull_request:
    paths:
      - "apps/web/**"
      - ".github/workflows/web-tests.yml"

permissions:
  contents: read

jobs:
  dotnet-tests:
    name: .NET tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      HATHOR_TEST_PG: "Host=localhost;Port=5432;Username=postgres;Password=postgres;Database=postgres"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        working-directory: apps/web
        run: dotnet restore Hathor.slnx

      - name: Run tests
        working-directory: apps/web
        run: >-
          dotnet test Hathor.slnx
          --configuration Release
          --no-restore
          --logger "console;verbosity=normal"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-test-results
          path: |
            apps/web/tests/**/TestResults
          if-no-files-found: ignore
