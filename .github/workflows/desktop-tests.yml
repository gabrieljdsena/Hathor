name: Desktop tests

on:
  push:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-tests.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Python tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            apps/desktop/requirements.txt
            apps/desktop/requirements-dev.txt

      - name: Install Python dependencies
        working-directory: apps/desktop
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Run Python unit tests
        working-directory: apps/desktop
        run: python -m pytest -q

      - name: Run JavaScript smoke tests
        working-directory: apps/desktop
        run: npm run test:js

      - name: Build Tailwind CSS
        working-directory: apps/desktop
        run: npx --yes @tailwindcss/cli@4.3.3 -i ./ui/input.css -o ./ui/output.css

  linux-scripts:
    name: Linux installer scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Bash syntax check
        run: |
          bash -n apps/desktop/scripts/install-linux.sh
          bash -n apps/desktop/scripts/package-linux.sh

      - name: ShellCheck
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y shellcheck
          fi
          shellcheck apps/desktop/scripts/install-linux.sh apps/desktop/scripts/package-linux.sh

