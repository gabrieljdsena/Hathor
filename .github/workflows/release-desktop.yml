name: Release desktop

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (blank = desktop-v<version.json versionName>)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Windows zip
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/desktop/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Python dependencies
        working-directory: apps/desktop
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Windows package
        working-directory: apps/desktop
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release.ps1 -SkipTests

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          path: apps/desktop/dist/hathor-desktop-*.zip
          if-no-files-found: error

  linux:
    name: Linux zip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Build portable Linux bundle
        run: bash apps/desktop/scripts/package-linux.sh

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-linux
          path: apps/desktop/dist/hathor-linux-*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [windows, linux]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="${{ github.ref_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            version="$(python3 -c 'import json; print(json.load(open("apps/desktop/version.json"))["versionName"])')"
            tag="desktop-v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Stage Linux installer
        shell: bash
        run: |
          set -euo pipefail
          cp apps/desktop/scripts/install-linux.sh release-assets/install-linux.sh
          chmod 755 release-assets/install-linux.sh

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum * | sort -k2 > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Hathor Desktop ${{ steps.tag.outputs.tag }}
          body: |
            Hathor desktop release.

            Linux (recommended, one command; installs under ~/.local):

                curl -fsSL https://github.com/gabrieljdsena/Hathor/releases/download/${{ steps.tag.outputs.tag }}/install-linux.sh | bash

            Add `--install-deps` if GTK/WebKitGTK/PyGObject packages are missing.
            Update later with `~/.local/opt/hathor/install-linux.sh --update`.

            - Windows: portable `hathor-desktop-*.zip` (sideload updater package)
            - Linux: `hathor-linux-*.zip` (offline bundle; `./install-linux.sh` or `./run.sh`)
            - Linux: `install-linux.sh` (standalone installer)
            - `SHA256SUMS.txt` contains checksums.
          files: |
            release-assets/*.zip
            release-assets/install-linux.sh
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true

