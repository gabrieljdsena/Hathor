name: Mobile tests

on:
  push:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-tests.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - ".github/workflows/mobile-tests.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: JVM unit tests (Robolectric)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4
        with:
          # The SDK now ships cmdline-tools 16, where the legacy `tools`
          # package no longer exists. Install only what Gradle needs.
          packages: "platform-tools platforms;android-34 build-tools;34.0.0"

      - name: Make Gradle wrapper executable
        working-directory: apps/mobile
        run: chmod +x ./gradlew

      - name: Run unit tests
        working-directory: apps/mobile
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-unit-test-reports
          path: |
            apps/mobile/app/build/reports/tests/testDebugUnitTest
            apps/mobile/app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore

