services:
  # Local database (replaces the old SQLite file): the API's primary store.
  localdb:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCALDB_PASSWORD:?set LOCALDB_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: hathor
    volumes:
      - localdbdata:/var/lib/postgresql/data
    # Host port 5433 avoids clashing with a natively installed Postgres on
    # 5432; containers reach this DB as `localdb:5432`.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hathor"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: src/Hathor.Api/Dockerfile
    environment:
      JWT_KEY: ${JWT_KEY:?set JWT_KEY in .env}
      Jwt__Issuer: hathor
      Jwt__Audience: hathor-clients
      Database__Provider: postgres
      Database__ConnectionString: "Host=localdb;Port=5432;Database=hathor;Username=postgres;Password=${LOCALDB_PASSWORD:?set LOCALDB_PASSWORD in .env}"
      Database__StorageRoot: /data/library
      # Shared lab Postgres hosting the `logs` table (myhomelab /logs reads
      # application='hathor' rows). host.docker.internal reaches the host's
      # native Postgres from the container. Password via LAB_DB_PASSWORD in
      # .env (or Logging__Password); empty = PG sink stays a no-op while
      # console/file logging keeps working.
      Logging__ConnectionString: "Host=host.docker.internal;Port=5432;Database=myhomelab;Username=postgres;Password=${LAB_DB_PASSWORD:-}"
      Downloads__MaxConcurrency: 3
      Cors__AllowedOrigins__0: http://localhost:8080
    volumes:
      - library:/data
    ports:
      - "5041:8080"
    healthcheck:
      # Readiness: 200 only when database + storage are reachable (503 else).
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health/ready > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      localdb:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/hathor-web/Dockerfile
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy

volumes:
  localdbdata:
  library:
