<script>
    window._podSongsData = [];
    window._podMenuFile = null;
    window._podTagsData = [];
    window._podTagMap = {};
    window._podActiveTagId = null;
    window._podAssignFile = null;

    function _podFormatDuration(totalSecs) {
        totalSecs = Math.floor(totalSecs || 0);
        if (!totalSecs) return '—';
        const h = Math.floor(totalSecs / 3600);
        const m = Math.floor((totalSecs % 3600) / 60);
        const s = (totalSecs % 60).toString().padStart(2, '0');
        if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s}`;
        return `${m}:${s}`;
    }

    function _podFormatDate(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        if (isNaN(d.getTime())) return '';
        return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
    }

    window._podVisibleSongs = function () {
        const list = [];
        document.querySelectorAll("#podcasts-list .podcast-row").forEach(row => {
            if (row.style.display !== "none" && row._songData) list.push(row._songData);
        });
        return list;
    };

    async function _podPlay(song) {
        song.IsPodcast = true;
        window.current_playing_song = song;
        if (window.set_active_song_ui) window.set_active_song_ui(song);
        if (window.pywebview && window.pywebview.api && window.pywebview.api.populate_queue_from_list) {
            await window.pywebview.api.populate_queue_from_list(
                song, window._podVisibleSongs(), null, { type: 'podcast', id: song.File });
        }
        await window.play_button(song);
    }

    function _podOpenMenu(file, x, y) {
        const menu = document.getElementById('pod-context-menu');
        if (!menu || !file) return;
        window._podMenuFile = file;
        menu.classList.remove('hidden');
        const w = menu.offsetWidth || 192;
        const h = menu.offsetHeight || 200;
        const pad = 8;
        let left = x, top = y;
        if (left + w > window.innerWidth - pad) left = Math.max(pad, window.innerWidth - w - pad);
        if (top + h > window.innerHeight - pad) top = Math.max(pad, window.innerHeight - h - pad);
        menu.style.left = left + 'px';
        menu.style.top = top + 'px';
    }

    function _podCloseMenu() {
        const menu = document.getElementById('pod-context-menu');
        if (menu) menu.classList.add('hidden');
        window._podMenuFile = null;
    }

    function _podSongByFile(file) {
        return ((window._podSongsData || []).find(s => s.File === file)) || null;
    }

    async function _podDetails(file) {
        const api = (window.pywebview && window.pywebview.api) ? window.pywebview.api : null;
        if (api && typeof api.get_podcast_details === 'function') {
            try {
                const det = await api.get_podcast_details(file);
                if (det && det.File) return det;
            } catch (e) { console.error('Podcast details failed:', e); }
        }
        return _podSongByFile(file) || { File: file, IsPodcast: true };
    }

    async function _podRefreshFile(file) {
        const det = await _podDetails(file);
        if (!det || !det.File) return;
        det.IsPodcast = true;
        const idx = (window._podSongsData || []).findIndex(s => s.File === file);
        if (idx > -1) window._podSongsData[idx] = det;
        window._podRender();
    }

    async function _podGetMetadata(file) {
        _podCloseMenu();
        await _podRefreshFile(file);
        if (typeof Notyf !== 'undefined') {
            new Notyf({ position: { x: 'right', y: 'bottom' } }).success('Metadata loaded');
        }
    }

    async function _podEdit(file) {
        _podCloseMenu();
        const song = await _podDetails(file);
        song.IsPodcast = true;
        if (typeof window.openEditModal === 'function') window.openEditModal(song);
    }

    async function _podDelete(file) {
        const confirmed = (typeof Swal !== 'undefined')
            ? (await Swal.fire({
                title: 'Delete episode?',
                text: 'The file will be permanently removed.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Yes, delete it'
            })).isConfirmed
            : confirm('Delete this episode?');
        if (!confirmed) return;
        try {
            if (window.pywebview && window.pywebview.api) {
                await window.pywebview.api.delete_podcast({ File: file });
            }
            window._podSongsData = (window._podSongsData || []).filter(s => s.File !== file);
            const row = document.querySelector(`#podcasts-list .podcast-row[data-file="${CSS.escape(file)}"]`);
            if (row) {
                row.style.transition = 'opacity 0.2s';
                row.style.opacity = '0';
                setTimeout(() => row.remove(), 200);
            }
            const countEl = document.getElementById("podcasts-count");
            if (countEl) {
                const n = document.querySelectorAll("#podcasts-list .podcast-row").length - (row ? 1 : 0);
                countEl.textContent = `${Math.max(0, n)} episode${n === 1 ? '' : 's'}`;
            }
        } catch (e) {
            console.error("Failed to delete podcast:", e);
        }
    }

    window._podRender = function () {
        const list = document.getElementById("podcasts-list");
        if (!list) return;
        const songs = window._podSongsData || [];
        list.innerHTML = '';
        const countEl = document.getElementById("podcasts-count");
        if (countEl) countEl.textContent = `${songs.length} episode${songs.length === 1 ? '' : 's'}`;
        if (!songs.length) {
            list.innerHTML = `<div class="py-16 flex flex-col items-center justify-center text-center opacity-70">
                <p class="text-zinc-400 font-medium text-lg">No episodes yet</p>
                <p class="text-sm text-zinc-500 mt-2 max-w-md">Download something and mark it as podcast / audio to build this library.</p>
            </div>`;
            return;
        }
        songs.forEach((song) => {
            song.IsPodcast = true;
            const row = document.createElement('div');
            row.className = 'podcast-row grid grid-cols-[minmax(0,1fr)_auto_auto] gap-4 items-center p-3 px-4 -mx-4 rounded-xl hover:bg-white/5 transition-all duration-300 cursor-pointer group';
            row.setAttribute('data-file', song.File || '');
            row._songData = song;

            const left = document.createElement('div');
            left.className = 'flex items-center gap-3 overflow-hidden';
            const cover = document.createElement('div');
            cover.className = 'w-12 h-12 rounded-lg bg-zinc-800 flex-shrink-0 overflow-hidden shadow-md';
            if (song.CoverArt) {
                const img = document.createElement('img');
                img.src = song.CoverArt;
                img.alt = song.Title || '';
                img.className = 'w-full h-full object-cover';
                cover.appendChild(img);
            } else {
                cover.innerHTML = `<div class="w-full h-full bg-zinc-800 flex items-center justify-center"><svg class="w-6 h-6 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 006-6v-1.5m-6 7.5a6 6 0 01-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 01-3-3V4.5a3 3 0 116 0v8.25a3 3 0 01-3 3z"/></svg></div>`;

            const meta = document.createElement('div');
            meta.className = 'flex flex-col min-w-0';
            const title = document.createElement('div');
            title.className = 'podcast-title text-sm font-medium text-zinc-100 truncate group-hover:text-orange-400 transition-colors';
            title.textContent = song.Title || 'Unknown Title';
            const sub = document.createElement('div');
            sub.className = 'text-xs text-zinc-500 truncate mt-0.5';
            const parts = [];
            if (song.Artist && song.Artist !== 'Unknown') parts.push(song.Artist);
            const dstr = _podFormatDate(song.DateDownload);
            if (dstr) parts.push(dstr);
            const tagNames = _podTagNamesFor(song.File);
            if (tagNames.length) parts.push(tagNames.join(', '));
            sub.textContent = parts.join(' • ');
            meta.appendChild(title);
            meta.appendChild(sub);
            left.appendChild(cover);
            left.appendChild(meta);

            const dur = document.createElement('div');
            dur.className = 'text-sm text-zinc-500 font-medium text-right whitespace-nowrap';
            dur.textContent = _podFormatDuration(song.Duration);

            const menuBtn = document.createElement('button');
            menuBtn.className = 'pod-menu-btn p-2 rounded-full text-zinc-600 hover:text-white hover:bg-white/10 transition-all focus:outline-none cursor-pointer';
            menuBtn.title = 'More actions';
            menuBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-zinc-400 hover:text-white pointer-events-none" fill="currentColor" viewBox="0 0 24 24"><circle cx="5" cy="5" r="1.5"/><circle cx="12" cy="5" r="1.5"/><circle cx="19" cy="5" r="1.5"/><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/><circle cx="5" cy="19" r="1.5"/><circle cx="12" cy="19" r="1.5"/><circle cx="19" cy="19" r="1.5"/></svg>`;
            menuBtn.addEventListener('click', (ev) => {
                ev.stopPropagation();
                const r = menuBtn.getBoundingClientRect();
                const menu = document.getElementById('pod-context-menu');
                const w = (menu && !menu.classList.contains('hidden')) ? menu.offsetWidth : 192;
                _podOpenMenu(song.File, r.right - w, r.bottom + 5);

            row.appendChild(left);
            row.appendChild(dur);
            row.appendChild(menuBtn);
            row.addEventListener('click', () => _podPlay(song));
            list.appendChild(row);
        });

        // Search + tag filter both apply here, so the visible rows (and the
        // queue built from them) always reflect the active filter.
        window._podApplyFilters();
        if (window.current_playing_song && typeof window.set_active_song_ui === 'function') {
            try { window.set_active_song_ui(window.current_playing_song); } catch (e) {}

    window._podApplySearch = function () {
        window._podApplyFilters();
    };

    window._podApplyFilters = function () {
        const input = document.getElementById("pod_txt_search");
        const q = (input && input.value ? input.value.toLowerCase() : "").trim();
        const active = window._podActiveTagId;
        const map = window._podTagMap || {};
        document.querySelectorAll("#podcasts-list .podcast-row").forEach(row => {
            const s = row._songData || {};
            const hay = `${s.Title || ''} ${s.Artist || ''}`.toLowerCase();
            const qOk = !q || hay.indexOf(q) > -1;
            const tOk = (active === null || active === undefined) ||
                ((map[s.File] || []).indexOf(active) > -1);
            row.style.display = (qOk && tOk) ? "" : "none";
        });
    };

    function _podTagNamesFor(file) {
        const ids = (window._podTagMap || {})[file] || [];
        if (!ids.length) return [];
        const byId = {};
        (window._podTagsData || []).forEach(t => { byId[t.id] = t.name; });
        return ids.map(id => byId[id]).filter(Boolean);
    }

    function _podEsc(s) {
        return String(s === null || s === undefined ? "" : s)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
    }

    window._podRenderChips = function () {
        const wrap = document.getElementById("pod-tags-row");
        if (!wrap) return;
        const tags = window._podTagsData || [];
        const total = (window._podSongsData || []).length;
        if (!tags.length) {
            wrap.classList.add("hidden");
            wrap.innerHTML = "";
            return;
        }
        wrap.classList.remove("hidden");
        wrap.innerHTML = "";
        const mk = (label, active, onclick) => {
            const b = document.createElement("button");
            b.className = active
                ? "flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-medium bg-orange-500 text-white shadow-lg shadow-orange-500/20 transition-all cursor-pointer"
                : "flex-shrink-0 px-4 py-1.5 rounded-full text-xs font-medium bg-white/5 border border-white/10 text-zinc-300 hover:text-white hover:bg-white/10 transition-all cursor-pointer";
            b.textContent = label;
            b.onclick = onclick;
            return b;
        };
        const noneActive = window._podActiveTagId === null || window._podActiveTagId === undefined;
        wrap.appendChild(mk(`All (${total})`, noneActive, () => {
            window._podActiveTagId = null;
            window._podRenderChips();
            window._podApplyFilters();
        }));
        tags.forEach(t => {
            wrap.appendChild(mk(`${t.name} (${t.episode_count || 0})`, window._podActiveTagId === t.id, () => {
                window._podActiveTagId = (window._podActiveTagId === t.id) ? null : t.id;
                window._podRenderChips();
                window._podApplyFilters();
            }));
        });
    };

    window._podRefreshTags = async function () {
        try {
            const api = (window.pywebview && window.pywebview.api) ? window.pywebview.api : null;
            if (!api) return;
            if (typeof api.get_podcast_tags === "function") {
                window._podTagsData = await api.get_podcast_tags() || [];
            }
            if (typeof api.get_podcast_tag_map === "function") {
                window._podTagMap = await api.get_podcast_tag_map() || {};
            }
            // A deleted tag never sticks as a filter.
            if (window._podActiveTagId !== null && window._podActiveTagId !== undefined) {
                const stillThere = (window._podTagsData || []).some(t => t.id === window._podActiveTagId);
                if (!stillThere) window._podActiveTagId = null;
            }
            window._podRenderChips();
            if (typeof window._podRender === "function") window._podRender();
        } catch (e) {
            console.error("Failed to load podcast tags:", e);
        }
    };

    window._podReload = async function () {
        try {
            const api = (window.pywebview && window.pywebview.api) ? window.pywebview.api : null;
            if (!api || typeof api.get_podcasts !== 'function') return;
            window._podSongsData = await api.get_podcasts() || [];
            window._podRender();
            if (typeof window._podRefreshTags === "function") window._podRefreshTags();
        } catch (e) {
            console.error("Failed to load podcasts:", e);
        }
    };

    document.getElementById('pod-play-all').addEventListener('click', async function () {
        const songs = window._podVisibleSongs();
        if (!songs || songs.length === 0) return;
        const currentFile = window.current_playing_song ? window.current_playing_song.File : null;
        const isFromHere = currentFile && songs.some(s => s.File === currentFile);
        if (isFromHere) {
            await window.toggle_play_pause();
            return;
        }
        await _podPlay(songs[0]);
    });

    // Podcast bento menu wiring (fresh elements on every view load)
    (function _podWireMenu() {
        const byId = (id, fn) => {
            const el = document.getElementById(id);
            if (el) el.onclick = fn;
        };
        const menuSong = () => {
            const f = window._podMenuFile;
            const s = f && _podSongByFile(f);
            if (s) s.IsPodcast = true;
            return s || null;
        };
        const toast = (msg) => {
            if (typeof Notyf !== 'undefined') {
                new Notyf({ position: { x: 'right', y: 'bottom' } }).success(msg);
            }
        };
        byId('podm-play', () => {
            const s = menuSong();
            _podCloseMenu();
            if (s) _podPlay(s);
        });
        byId('podm-next', () => {
            const s = menuSong();
            _podCloseMenu();
            if (!s) return;
            window.is_custom_queue = true;
            window.queue_songs.unshift(s);
            if (typeof window.update_queue_ui === 'function') window.update_queue_ui();
            if (window.pywebview && window.pywebview.api && window.pywebview.api.next_to_queue) {
                window.pywebview.api.next_to_queue(s);
            }
            toast({ message: `<b>${s.Title}</b> will play next`, duration: 3000 });
        });
        byId('podm-addq', () => {
            const s = menuSong();
            _podCloseMenu();
            if (!s) return;
            window.is_custom_queue = true;
            window.queue_songs.push(s);
            if (typeof window.update_queue_ui === 'function') window.update_queue_ui();
            if (window.pywebview && window.pywebview.api && window.pywebview.api.add_to_queue) {
                window.pywebview.api.add_to_queue(s);
            }
            toast({ message: `Added <b>${s.Title}</b> to Queue`, duration: 3000 });
        });
        byId('podm-getmeta', () => { const f = window._podMenuFile; if (f) _podGetMetadata(f); });
        byId('podm-edit', () => { const f = window._podMenuFile; if (f) _podEdit(f); });
        byId('podm-tags', () => { const f = window._podMenuFile; _podCloseMenu(); if (f) window._podOpenAssign(f); });
        byId('podm-chapters', () => { const f = window._podMenuFile; _podCloseMenu(); if (f) window._podOpenChapters(f); });
        byId('podm-delete', () => { const f = window._podMenuFile; _podCloseMenu(); if (f) _podDelete(f); });
    })();

    // ---- Podcast tag CRUD (manager modal + per-episode assignment) ----
    function _podShowModal(id) {
        const m = document.getElementById(id);
        if (!m) return;
        m.classList.remove("hidden");
        m.classList.add("flex");
    }

    function _podHideModal(id) {
        const m = document.getElementById(id);
        if (!m) return;
        m.classList.add("hidden");
        m.classList.remove("flex");
    }

    function _podNotifyOk(msg) {
        if (typeof Notyf !== 'undefined') {
            new Notyf({ position: { x: 'right', y: 'bottom' } }).success(msg);
        }
    }

    function _podNotifyErr(msg) {
        if (typeof Notyf !== 'undefined') {
            new Notyf({ position: { x: 'right', y: 'bottom' } }).error(msg);
        } else {
            alert(msg);
        }
    }

    window._podCloseTagsModal = () => _podHideModal("pod-tags-modal");
    window._podCloseAssignModal = () => { window._podAssignFile = null; _podHideModal("pod-assign-modal"); };

    // ---- Podcast chapter marks (web parity) ----
    window._podChaptersFile = null;
    window._podChaptersEditId = null;

    window._podCloseChaptersModal = () => {
        window._podChaptersFile = null;
        window._podChaptersEditId = null;
        _podHideModal("pod-chapters-modal");
    };

    function _podFmtTime(sec) {
        if (sec === null || sec === undefined || isNaN(sec)) return "—";
        sec = Math.max(0, Math.floor(sec));
        const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
        const mm = h > 0 ? String(m).padStart(2, "0") : String(m);
        return (h > 0 ? h + ":" : "") + mm + ":" + String(s).padStart(2, "0");
    }

    function _podParseTime(raw) {
        if (raw === null || raw === undefined) return null;
        const t = String(raw).trim();
        if (!t) return null;
        if (/^\d+(\.\d+)?$/.test(t)) return parseFloat(t);
        const parts = t.split(":").map(p => p.trim());
        if (parts.length > 3 || parts.some(p => !/^\d+(\.\d+)?$/.test(p))) return NaN;
        let sec = 0;
        for (const p of parts) sec = sec * 60 + parseFloat(p);
        return sec;
    }

    function _podChapterApi() {
        return (window.pywebview && window.pywebview.api) || null;
    }

    function _podSeekTo(sec) {
        const api = _podChapterApi();
        if (typeof window.progress_slider_click === "function") {
            window.progress_slider_click(sec);
        } else if (api && api.progress_slider_click) {
            api.progress_slider_click(sec);
        }
    }

    window._podOpenChapters = function (file) {
        window._podChaptersFile = file;
        window._podChaptersEditId = null;
        const cap = document.getElementById("pod-chapters-caption");
        if (cap) cap.textContent = file || "";
        window._podRenderChapters();
        _podShowModal("pod-chapters-modal");
        setTimeout(() => { const i = document.getElementById("pod-chapter-name"); if (i) i.focus(); }, 50);
    };

    window._podRenderChapters = async function () {
        const list = document.getElementById("pod-chapters-list");
        if (!list) return;
        const file = window._podChaptersFile;
        const api = _podChapterApi();
        let chapters = [];
        if (api && api.get_podcast_chapters && file) {
            try { chapters = await api.get_podcast_chapters(file); } catch (e) { chapters = []; }
        }
        list.innerHTML = "";
        if (!chapters.length) {
            list.innerHTML = `<p class="text-xs text-zinc-500">No chapters yet — mark the moments worth jumping back to.</p>`;
            return;
        }
        const editId = window._podChaptersEditId;
        chapters.forEach(c => {
            const row = document.createElement("div");
            row.className = "flex items-center gap-3 bg-white/5 border border-white/10 rounded-xl p-2.5";
            if (editId === c.id) {
                row.innerHTML = `
                    <div class="flex-1 min-w-0 flex flex-col gap-2">
                        <input type="text" data-f="name" value="${_podEsc(c.name)}" spellcheck="false"
                            class="w-full bg-zinc-800/80 border border-white/10 rounded-lg px-3 py-1.5 text-sm text-zinc-200 focus:outline-none focus:border-orange-500/50">
                        <div class="flex gap-2">
                            <input type="text" data-f="start" value="${_podFmtTime(c.startSecs)}" spellcheck="false"
                                class="flex-1 min-w-0 bg-zinc-800/80 border border-white/10 rounded-lg px-3 py-1.5 text-sm font-mono text-zinc-200 focus:outline-none focus:border-orange-500/50">
                            <input type="text" data-f="end" value="${c.endSecs === null || c.endSecs === undefined ? '' : _podFmtTime(c.endSecs)}" placeholder="End (optional)" spellcheck="false"
                                class="flex-1 min-w-0 bg-zinc-800/80 border border-white/10 rounded-lg px-3 py-1.5 text-sm font-mono text-zinc-200 focus:outline-none focus:border-orange-500/50">
                        </div>
                    </div>
                    <div class="flex flex-col gap-1 flex-shrink-0">
                        <button data-act="save" title="Save" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-white bg-orange-500 hover:bg-orange-400 transition-all cursor-pointer">Save</button>
                        <button data-act="cancel" title="Cancel" class="px-3 py-1.5 rounded-lg text-xs text-zinc-400 hover:text-white hover:bg-white/10 transition-all cursor-pointer">Cancel</button>
                    </div>`;
                row.querySelector('[data-act="save"]').onclick = async () => {
                    const name = row.querySelector('[data-f="name"]').value;
                    const start = _podParseTime(row.querySelector('[data-f="start"]').value);
                    const endRaw = row.querySelector('[data-f="end"]').value;
                    const end = endRaw.trim() ? _podParseTime(endRaw) : null;
                    const res = await api.update_podcast_chapter(c.id, name, start, end);
                    if (res && res.ok) {
                        window._podChaptersEditId = null;
                        window._podRenderChapters();
                    } else {
                        _podNotifyErr((res && res.message) || "Could not save the chapter.");
                    }
                };
                row.querySelector('[data-act="cancel"]').onclick = () => {
                    window._podChaptersEditId = null;
                    window._podRenderChapters();
                };
            } else {
                const endLabel = (c.endSecs === null || c.endSecs === undefined)
                    ? "open-ended" : ("→ " + _podFmtTime(c.endSecs));
                row.innerHTML = `
                    <button data-act="seek" title="Skip to ${_podEsc(_podFmtTime(c.startSecs))}"
                        class="font-mono text-xs font-semibold text-orange-400 bg-orange-500/10 border border-orange-500/20 rounded-lg px-2 py-1 hover:bg-orange-500/20 transition-all cursor-pointer whitespace-nowrap flex-shrink-0">${_podEsc(_podFmtTime(c.startSecs))}</button>
                    <div class="flex-1 min-w-0">
                        <div class="text-sm font-medium text-zinc-100 truncate">${_podEsc(c.name)}</div>
                        <div class="text-xs text-zinc-500">${_podEsc(endLabel)}</div>
                    </div>
                    <button data-act="edit" title="Edit chapter" class="p-2 rounded-full text-zinc-500 hover:text-white hover:bg-white/10 transition-all focus:outline-none cursor-pointer">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" /></svg>
                    </button>
                    <button data-act="delete" title="Delete chapter" class="p-2 rounded-full text-red-400/70 hover:text-red-300 hover:bg-white/10 transition-all focus:outline-none cursor-pointer">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    </button>`;
                row.querySelector('[data-act="seek"]').onclick = () => _podSeekTo(c.startSecs);
                row.querySelector('[data-act="edit"]').onclick = () => {
                    window._podChaptersEditId = c.id;
                    window._podRenderChapters();
                };
                const delBtn = row.querySelector('[data-act="delete"]');
                delBtn.onclick = async () => {
                    if (delBtn.dataset.armed) {
                        if (await api.delete_podcast_chapter(c.id)) {
                            window._podRenderChapters();
                        } else {
                            _podNotifyErr("Could not delete the chapter.");
                        }
                    } else {
                        delBtn.dataset.armed = "1";
                        delBtn.classList.add("bg-red-500/20");
                        delBtn.title = "Click again to confirm";
                        setTimeout(() => { delete delBtn.dataset.armed; delBtn.classList.remove("bg-red-500/20"); }, 3000);
                    }
                };
            }
            list.appendChild(row);
        });
    };

    window._podAddChapter = async function () {

        const startEl = document.getElementById("pod-chapter-start");

            nameEl.value = "";

        if (!name) return;
        try {
            const id = await window.pywebview.api.new_podcast_tag(name);

            title: "Rename tag",
            input: "text",
            inputValue: current || "",
            showCancelButton: true,
            confirmButtonText: "Save",
            confirmButtonColor: "#f97316",
            background: "#18181b",
            color: "#f4f4f5",
            inputValidator: (v) => ((!v || !v.trim()) ? "Name can't be blank." : undefined)
        });
        if (!res.isConfirmed) return;
        try {
            const ok = await window.pywebview.api.rename_podcast_tag(id, res.value.trim());
            if (ok === true) {
                await window._podRefreshTags();
                window._podRenderTagsList();
                _podNotifyOk("Tag renamed");
            } else {
                _podNotifyErr("Name is already used.");
            }
        } catch (e) {
            console.error("Rename tag failed:", e);
        }
    };

    window._podDeleteTag = async function (id, name, count) {
        const confirmed = (typeof Swal !== "undefined")
            ? (await Swal.fire({
                title: "Delete tag?",
                text: `"${name}" will be removed from ${count || 0} episode(s) and from the remote library.`,
                icon: "warning",
                showCancelButton: true,
                confirmButtonText: "Yes, delete it",
                confirmButtonColor: "#ef4444",
                background: "#18181b",
                color: "#f4f4f5"
            })).isConfirmed
            : confirm(`Delete tag "${name}"?`);
        if (!confirmed) return;
        try {
            await window.pywebview.api.delete_podcast_tag(id);
            await window._podRefreshTags();
            window._podRenderTagsList();
            _podNotifyOk("Tag deleted");
        } catch (e) {
            console.error("Delete tag failed:", e);
        }
    };

    window._podOpenAssign = function (file) {
        window._podAssignFile = file;
        const song = _podSongByFile(file);
        const cap = document.getElementById("pod-assign-caption");
        if (cap) cap.textContent = (song && (song.Title || song.File)) || file;
        window._podRenderAssignPills();
        _podShowModal("pod-assign-modal");
    };

    window._podRenderAssignPills = function () {
        const wrap = document.getElementById("pod-assign-pills");
        if (!wrap) return;
        wrap.innerHTML = "";
        const tags = window._podTagsData || [];
        const assigned = new Set(((window._podTagMap || {})[window._podAssignFile] || []));
        if (!tags.length) {
            wrap.innerHTML = `<p class="text-xs text-zinc-500">No tags yet — create one below, it assigns right away.</p>`;
            return;
        }
        tags.forEach(t => {
            const on = assigned.has(t.id);
            const b = document.createElement("button");
            b.className = on
                ? "px-4 py-1.5 rounded-full text-xs font-medium bg-orange-500 text-white shadow-lg shadow-orange-500/20 transition-all cursor-pointer"
                : "px-4 py-1.5 rounded-full text-xs font-medium bg-white/5 border border-white/10 text-zinc-300 hover:text-white hover:bg-white/10 transition-all cursor-pointer";
            b.textContent = `${t.name} (${t.episode_count || 0})`;
            b.onclick = async () => {
                try {
                    if (on) await window.pywebview.api.unassign_podcast_tag(window._podAssignFile, t.id);
                    else await window.pywebview.api.assign_podcast_tag(window._podAssignFile, t.id);
                    await window._podRefreshTags();
                    window._podRenderAssignPills();
                } catch (e) {
                    console.error("Tag toggle failed:", e);
                }
            };
            wrap.appendChild(b);
        });
    };

    window._podAssignCreate = async function () {
        const input = document.getElementById("pod-assign-new-name");
        const name = (input && input.value ? input.value : "").trim();
        if (!name || !window._podAssignFile) return;
        try {
            const id = await window.pywebview.api.new_podcast_tag(name);
            if (id !== -1 && id !== null && id !== undefined) {
                await window.pywebview.api.assign_podcast_tag(window._podAssignFile, id);
                if (input) input.value = "";
                await window._podRefreshTags();
                window._podRenderAssignPills();
                _podNotifyOk("Tag assigned");
            } else {
                _podNotifyErr("Name is blank or already used.");
            }
        } catch (e) {
            console.error("Assign-create tag failed:", e);
        }
    };

    document.getElementById('pod-manage-tags').addEventListener('click', () => window._podOpenTagsModal());
    [["pod-tags-modal", "window._podCloseTagsModal"], ["pod-assign-modal", "window._podCloseAssignModal"]].forEach(([id]) => {
        const m = document.getElementById(id);
        if (m) m.addEventListener('click', (e) => { if (e.target === m) _podHideModal(id); });
    });

    if (!window._podMenuEvents) {
        window._podMenuEvents = true;
        document.addEventListener('click', function (e) {
            if (e.target && (e.target.closest('#pod-context-menu') || e.target.closest('.pod-menu-btn'))) return;
            _podCloseMenu();
        });
        document.addEventListener('contextmenu', function (e) {
            const row = (e.target && e.target.closest) ? e.target.closest('.podcast-row') : null;
            if (!row) {
                _podCloseMenu();
                return;
            }
            e.preventDefault();
            const file = row.getAttribute('data-file');
            _podOpenMenu(file, e.clientX, e.clientY);
        });
    }

    window.clearPodcastSearch = function () {
        const input = document.getElementById("pod_txt_search");
        if (input) {
            input.value = "";
            const clearBtn = document.getElementById("pod_clearBtn");
            if (clearBtn) clearBtn.classList.add("hidden");
            window._podApplySearch("");
            input.focus();
        }
    };

    if (!window.podSearchAttached) {
        window.podSearchAttached = true;
        let searchTimeout;
        document.addEventListener("keyup", function (e) {
            if (e.target && e.target.id === "pod_txt_search") {
                clearTimeout(searchTimeout);
                const value = e.target.value.toLowerCase();
                const clearBtn = document.getElementById('pod_clearBtn');
                if (clearBtn) clearBtn.classList.toggle('hidden', !(e.target.value.length > 0));
                searchTimeout = setTimeout(() => window._podApplySearch(value), 150);
            }
        });
    }

    window._podReload();

    fetch('modals/edit_song.html')
        .then(response => response.text())
        .then(html => {
            const c = document.getElementById('edit-song-modal-container');
            if (!c) return;
            c.innerHTML = html;
            const scripts = c.getElementsByTagName('script');
            for (let i = 0; i < scripts.length; i++) {
                window.eval(scripts[i].innerText);
            }
        }).catch(err => console.error('Failed to load modal:', err));
</script>
